<!-- ============================================================
     SUNSHINE HOMES — Homepage Squarespace Snippet
     Paste this ONCE into the Squarespace Code Block on the Homepage.
     All future updates are pushed via GitHub — no need to edit this again.
     ============================================================ -->

<div id="sh-github-loader">Loading...</div>

<script>
(function() {
  var GITHUB_URL = 'https://saifeem52-wq.github.io/sunshine-homes-website/pages/home.html';
  var container = document.getElementById('sh-github-loader');

  fetch(GITHUB_URL)
    .then(function(r) { return r.text(); })
    .then(function(html) {
      container.outerHTML = html;
    })
    .catch(function() {
      container.innerHTML = '<p style="text-align:center;padding:2rem">Unable to load content. Please try refreshing.</p>';
    });
})();
</script>
